#bind=SUPER,D,spawn_shell,sh -c "mmsg dispatch focusdir,right && mmsg dispatch toggle_render_border && sleep 0.5 && mmsg dispatch toggle_render_border"


# swap window
bind=SUPER+SHIFT,W,exchange_client,up
bind=SUPER+SHIFT,S,exchange_client,down
bind=SUPER+SHIFT,A,exchange_client,left
bind=SUPER+SHIFT,D,exchange_client,right

# switch window status
bind=SUPER,g,toggleglobal,
bind=ALT,Tab,togglejump,
#bind=SUPER,z,togglejump, # bloat keybind tbh
#bind=ALT,backslash,togglefloating,
bind=SUPER+SHIFT,f,togglemaximizescreen,# FUTURE? idk what maximize is
