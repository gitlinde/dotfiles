# More option see https://github.com/DreamMaoMao/mango/wiki/

# Window effect
blur=0
blur_layer=0
blur_optimized=1
blur_params_num_passes = 2
blur_params_radius = 5
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2

shadows = 0
layer_shadows = 0
shadow_only_floating = 1
shadows_size = 10
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0
shadowscolor= 0x000000ff

border_radius=6
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=0.85

# Animation Configuration(support type:zoom,slide)
# tag_animation_direction: 1-horizontal,0-vertical
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.4
zoom_end_ratio=0.8
fadein_begin_opacity=0.5
fadeout_begin_opacity=0.8
animation_duration_move=500
animation_duration_open=400
animation_duration_tag=350
animation_duration_close=800
animation_duration_focus=0
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opafadeout=0.5,0.5,0.5,0.5
animation_curve_opafadein=0.46,1.0,0.29,1

# animation_duration_tag=0
# animation_duration_open=0


# Scroller Layout Setting
scroller_structs=0
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=1
edge_scroller_pointer_focus=1 # i think is annoying.. maybe..
edge_scroller_focus_allow_speed=0.0
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# Master-Stack Layout Setting
new_is_master=1
default_mfact=0.55
default_nmaster=1
tag_num=9
smartgaps=0

# Dwindle Layout Setting
dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_hsplit=1
dwindle_vsplit=1
dwindle_preserve_split=0

# Overview Setting
hotarea_size=10
enable_hotarea=1
hotarea_corner=0 # top left
overviewgappi=10
overviewgappo=10
overcircle_center_ratio=0.5



# Experiments
# ov_tab_mode=1

# Exec
exec=notify-send -u low -i "$HOME/Pictures/mangologo.svg" "Mango" "Configuration updated :3"
exec-once=noctalia
#exec-once=vivaldi
#exec-once=dissent
#exec-once=obsidian


exec-once = sh -c 'sleep 3 && mmsg dispatch view,1'

#exec-once = alacritty -T spotatui -e spotatui


exec-once=mmsg dispatch tag,3; alacritty -e spotatui
exec-once=vivaldi
exec-once=dissent
exec-once=obsidian

exec-once=mmsg dispatch zoom

# Misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idleinhibit_ignore_visible=0
sloppyfocus=1
warpcursor=1
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30

drag_tile_to_tile=1
drag_tile_small=1

# keyboard
repeat_rate=25
repeat_delay=600
numlockon=0
xkb_rules_layout=dk

# Trackpad
# need relogin to make it apply
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=1

# thius toot
# disable_while_typing=1
# these just didnt work idk
# left_handed=0
# middle_button_emulation=0
# swipe_min_threshold=1

# mouse
# need relogin to make it apply
mouse_natural_scrolling=0
mouse_accel_profile=1 # flat acceleration profile
#mouse_accel_speed=0.9 # doesn't do anything to trackpad?

# trackpad and gestures
trackpad_accel_profile=1 # flat acceleration profile
trackpad_accel_speed=0.5
trackpad_scroll_factor=0.6 # try to get high without being annoying


gesture_live=1

# 3-finger: Window focus
gesturebind=none,left,3,focusdir,left
gesturebind=none,right,3,focusdir,right
gesturebind=none,up,3,focusdir,up
gesturebind=none,down,3,focusdir,down


# 3-finger: Window change
bind=SUPER+SHIFT,W,exchange_client,up
bind=SUPER+SHIFT,S,exchange_client,down
bind=SUPER+SHIFT,A,exchange_client,left
bind=SUPER+SHIFT,D,exchange_client,right

gesturebind=Shift,left,3,exchange_client,left
gesturebind=Shift,right,3,exchange_client,right
gesturebind=Shift,up,3,exchange_client,up
gesturebind=Shift,down,3,exchange_client,down


# 4-finger: Workspace navigation (right drag -> previous tag, left drag -> next)
gesturebind=none,right,4,viewprev_have_client
gesturebind=none,left,4,viewnext_have_client
gesturebind=none,up,4,toggleoverview
gesturebind=none,down,4,toggleoverview



# Appearance
gappih=0 # 5
gappiv=0 # 5
gappoh=0 # 10
gappov=0 # 19

#gappih=5 # 5
#gappiv=5 # 5
#gappoh=0 # 10
#gappov=0 # 19


scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
borderpx=0
#borderpx=0d
rootcolor=0x201b14ff
bordercolor=0x444444ff
dropcolor=0x8FBA7C55
splitcolor=0xEB441EFF

focuscolor=0xc9b890ff
#focuscolor=0xff0000ff


maximizescreencolor=0x89aa61ff
urgentcolor=0xad401fff
scratchpadcolor=0x516c93ff
globalcolor=0xb153a7ff
overlaycolor=0x14a57cff

# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
tagrule=id:1,layout_name:monocle
tagrule=id:2,layout_name:tile
tagrule=id:3,layout_name:scroller
tagrule=id:4,layout_name:tile
tagrule=id:5,layout_name:tile
tagrule=id:6,layout_name:tile
tagrule=id:7,layout_name:tile
tagrule=id:8,layout_name:tile
tagrule=id:9,layout_name:tile


# switch binds, when closing lid, laptop lid, screen turn off, close lid
switchbind=fold,spawn_shell,playerctl pause; wpctl set-mute @DEFAULT_AUDIO_SINK@ 1

# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keysname: super,ctrl,alt,shift,none

bind=SUPER,r,reload_config
# reload config

# menu and terminal

bind=SUPER,space,spawn, noctalia msg panel-toggle launcher

# bind=Alt,space,spawn,rofi -show drun
# bind=Alt,Return,spawn,foot
bind=SUPER,T,spawn, alacritty
bind=SUPER,Return,spawn, alacritty


# exit
bind=SUPER,m,quit
bind=SUPER,q,killclient,


# Overcircle is cool, but not sure if it has much practical use?
# Isn't alt+tab overview just better
# I think current_prev and current_next make it useful
#bind=SUPER,right,overcircle,current_next
#bind=SUPER,left,overcircle,current_prev
#bind=SUPER,up,overcircle,next
#bind=SUPER,down,overcircle,prev


# switch window focus
bind=SUPER,Tab,focusstack,next
bind=SUPER+SHIFT,Tab,focusstack,previous

bind=SUPER,W,focusdir,up
bind=SUPER,A,focusdir,left
bind=SUPER,S,focusdir,down
bind=SUPER,D,focusdir,right


#bind=SUPER,W,spawn_shell,sh -c "mmsg dispatch focusdir,up && mmsg dispatch toggle_render_border && sleep 0.5 && mmsg dispatch toggle_render_border"
#bind=SUPER,A,spawn_shell,sh -c "mmsg dispatch focusdir,left && mmsg dispatch toggle_render_border && sleep 0.5 && mmsg dispatch toggle_render_border"
