bind=SUPER,f,togglefullscreen,
#bind=ALT+SHIFT,f,togglefakefullscreen,
#bind=SUPER,z,toggleoverlay, # OVERLAY IN THIS IS LIKE DESKTOP OVERLAY

bind=SUPER,i,minimized,
bind=SUPER+SHIFT,I,restore_minimized, #FUTURE
bind=ALT,z,toggle_scratchpad # FUTURE

# scroller layout # This is going to have to be later. Too much alt use.
#bind=ALT,e,set_proportion,1.0
bind=ALT,f,switch_proportion_preset,

