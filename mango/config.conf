# window rules
#togglemaximizescreen

# https://mangowm.github.io/docs/window-management/rules/
# windowrule=Parameter:Values,title:Values
# to force vivaldi to be maximized
windowrule=force_fakemaximize:1,tags:1, appid:vivaldi
# windowrule=tags:3, class:spotatui-term$ # alacritty spotatui
windowrule = tags:3,appid:spotatui

#windowrule=isfakefullscreen:1,tags:1,appid:vivaldi
#togglefakefullscreen

windowrule=tags:9, appid:obsidian
windowrule=tags:1, appid:dissent



#windowrule = appid:legcord, nofocus
#windowrule = isopensilent:1,appid:legcord


# vivaldi + legcord always starts in workspace 1
windowrule=tags:1,appid:vivaldi
windowrule=tags:1,appid:webcord


